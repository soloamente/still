# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      # Paths come from git inside the script — avoids Windows splitting on spaces.
      run: bun scripts/biome-staged.mjs
      stage_fixed: true
